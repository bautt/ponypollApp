# Pony Poll — custom Splunk roles
#
# ponypoll_admin : full quiz management (edit questions, quizzes, config)
#                  additive role — users keep their existing Splunk base role
# ponypoll_user  : quiz participation only (read questions, submit answers)
#                  inherits user role for basic Splunk access
# ponypoll_guest : locked-down participation for shared workshop accounts
#                  no base role — only the capabilities the /play view needs
#
# Assignment:
#   All Splunk admins already satisfy ponypoll_admin via metadata (admin/sc_admin).
#   Assign ponypoll_admin explicitly to give non-admin power users quiz admin rights.
#   Assign ponypoll_user to grant quiz access without any other Splunk permissions.
#   Assign ponypoll_guest instead of ponypoll_user for shared workshop logins.

[role_ponypoll_admin]
srchIndexesAllowed = ponypoll;*
srchIndexesDefault = ponypoll

[role_ponypoll_user]
importRoles = user
srchIndexesAllowed = ponypoll
srchIndexesDefault = ponypoll
edit_kvstore = enabled
edit_tcp = enabled
# Default `user` role allows only 3 concurrent historical searches, which is
# below what the Analytics page (and Splunk dashboards in this app) need
# during normal interactive use. Bumped to 6 so a participant role can open
# Analytics without hitting `role-based concurrency limit` 503s. Still well
# under admin defaults — no risk of runaway search load.
srchJobsQuota = 6

# Guest role for shared workshop logins, e.g. a single account the whole room
# uses via the join QR code.
#
# Deliberately has no `importRoles`. The `user` role carries capabilities that
# a room full of strangers should not have, notably `delete_by_keyword`,
# `run_collect`, `run_dump`, `rest_properties_set` and `upload_lookup_files`.
# Everything below is granted individually because the /play view needs it.
[role_ponypoll_guest]
# Reveal screen runs `services/search/jobs` as the participant for the
# mini-leaderboard and the answer distribution bars.
search = enabled
# Reads the `ponypoll_index` macro via configs/conf-macros to learn the target
# index before submitting.
rest_properties_get = enabled
# Required by `services/receivers/simple`, which is how answers are indexed.
# This is the broadest capability here — it also permits editing TCP inputs.
# Prefer this role on a dedicated workshop search head rather than a
# production one.
edit_tcp = enabled
# Writes the nickname into the ponypoll_presence lobby collection.
edit_kvstore = enabled
# Lets Splunk Web resolve the app context for the /play view.
rest_apps_view = enabled

# Data access stays inside the poll index, and inside this app's sourcetypes.
srchIndexesAllowed = ponypoll
srchIndexesDefault = ponypoll
srchFilter = sourcetype=ponypoll_*
# Same reasoning as ponypoll_user above; the reveal screen fires two searches.
srchJobsQuota = 6
rtSrchJobsQuota = 0
# A quiz never needs history beyond the session itself.
srchTimeWin = 86400
